updates:
  - assignees:
      - ffflorian
    commit-message:
      prefix: fix(deps)
    cooldown:
      default-days: 5
      exclude:
        - node
        - nginx
    directory: /
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 99
    package-ecosystem: docker
    schedule:
      interval: monthly
  - assignees:
      - ffflorian
      - lenaimdahl
    commit-message:
      prefix: fix(deps)
      prefix-development: chore(deps-dev)
    cooldown:
      default-days: 5
      exclude:
        - '@ffflorian/*'
    directory: /
    groups:
      mui:
        patterns:
          - '@mui*'
      nestjs:
        patterns:
          - '@nestjs*'
      oxlint:
        patterns:
          - oxlint
          - eslint-plugin-oxlint
      react:
        patterns:
          - react*
      testing-library:
        patterns:
          - '@testing-library*'
      vitest:
        patterns:
          - '@vitest*'
          - vitest*
    ignore:
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      # see https://github.com/jsx-eslint/eslint-plugin-react/issues/3977
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 99
    package-ecosystem: npm
    schedule:
      interval: monthly
    versioning-strategy: increase
  - assignees:
      - ffflorian
    commit-message:
      prefix: ci(deps)
    cooldown:
      default-days: 5
      exclude:
        - ffflorian/*
    directory: /
    open-pull-requests-limit: 99
    package-ecosystem: github-actions
    schedule:
      interval: monthly
version: 2
