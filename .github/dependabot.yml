version: 2
updates:
  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 99
    assignees:
      - ffflorian
    ignore:
      - dependency-name: node
        versions:
          - '> 24'
    cooldown:
      default-days: 5
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 99
    assignees:
      - ffflorian
      - lenaimdahl
    versioning-strategy: increase
    groups:
      react:
        patterns:
          - 'react*'
          - 'react-dom*'
      nestjs:
        patterns:
          - '@nestjs*'
      mui:
        patterns:
          - '@mui*'
      vitest:
        patterns:
          - '@vitest*'
          - 'vitest'
      testing-library:
        patterns:
          - '@testing-library*'
    ignore:
      # see https://github.com/jsx-eslint/eslint-plugin-react/issues/3977
      - dependency-name: 'eslint'
        versions:
          - '>= 10'
      - dependency-name: '@types/node'
        versions:
          - '>= 24'
    cooldown:
      default-days: 5
      exclude:
        - '@ffflorian/*'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 99
    assignees:
      - ffflorian
    cooldown:
      default-days: 5
      exclude:
        - 'ffflorian/*'
